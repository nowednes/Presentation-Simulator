function behReset(){BEH.on=false;STU.forEach(c=>{c.b=null;c.head.rotation.set(0,0,0);c.g.rotation.y=0;c.mouth.scale.set(1,1,1);c.fa.forEach(a=>{a.position.y=.6;a.position.z=.38})})}
function behTick(now){
 if(!G.playing){if(BEH.on)behReset();return}
 if(!BEH.on)return;
 const dt=Math.min(.1,(now-BEH.t)/1000),k=1-Math.exp(-dt*3.5);BEH.t=now;
 STU.forEach(c=>{const b=c.b;if(!b)return;
  if(G.ev&&G.ev.ch===c){b.pitch=b.yaw=b.body=b.typ=b.mouth=0;c.head.rotation.x=c.head.rotation.y=0;c.g.rotation.y=0;return} /* 긴장 연출 학생은 건드리지 않음 */
  if(now>=b.until)behSet(c,bPick(BW[b.st]),now);
  const s=b.st,t=now/1000;let P=0,Y=0,Bd=0,T=0,M=0;
  if(s==='doze')P=.1+.45*(.5+.5*Math.sin(t*1.6+b.ph));
  else if(s==='type'){P=.3;T=1}
  else if(s==='away'){Y=b.dir*.75;P=-.05}
  else if(s==='chat'){Y=b.side*.55;Bd=b.side*.12;P=.05;M=b.talk?1:0}
  b.pitch+=(P-b.pitch)*k;b.yaw+=(Y-b.yaw)*k;b.body+=(Bd-b.body)*k;b.typ+=(T-b.typ)*k;b.mouth+=(M-b.mouth)*k;
  c.head.rotation.x=b.pitch;c.head.rotation.y=b.yaw;c.g.rotation.y=b.body;
  c.fa.forEach((a,i)=>{a.position.y=.6+b.typ*.02*Math.sin(t*14+i*2.1);a.position.z=.38+b.typ*.03*Math.sin(t*14+i*2.1+1)});
  c.mouth.scale.y=1+b.mouth*2.5*Math.max(0,Math.sin(t*11))})}
function tick(now){
 if(G.playing){const rem=remaining(now);$('timer').textContent=Math.max(0,Math.ceil(rem));
  if(G.ev&&now-G.ev.t0>=G.ev.dur)endEvent();
  const hit=[30,20,10].filter(s=>!G.said[s]&&rem<=s&&rem>0);
  if(hit.length){hit.forEach(s=>G.said[s]=1);say(Math.min(...hit)+'초 남았습니다')}
  if(rem<=0)fail()}
 if(G.ev){const t=now-G.ev.t0,d=G.ev.dur;let k=easeBack(t/180);if(t>d-250)k=Math.max(0,(d-t)/250);pose(G.ev.ch,Math.min(1.08,k),now)}
 CH.forEach(c=>{if(!G.ev||G.ev.ch!==c)c.g.position.y=c.home.y+Math.sin(now/600+c.seed)*.02});
 if($('bubble').style.display==='block')placeBubble();behTick(now);sbTick(now)}
(function loop(now){requestAnimationFrame(loop);tick(performance.now());R.render(scene,cam)})();
resetState();buildScript();
if(MOB()){stage.style.width=SW+'px';stage.style.height=SH+'px';if(navigator.virtualKeyboard)navigator.virtualKeyboard.overlaysContent=true}
addEventListener('resize',onResize);MQ.addEventListener&&MQ.addEventListener('change',onResize);addEventListener('orientationchange',()=>setTimeout(onResize,300));
if(vv){const f=()=>{if(MOB())requestAnimationFrame(kbMetrics)};vv.addEventListener('resize',f);vv.addEventListener('scroll',f)}
if(navigator.virtualKeyboard)navigator.virtualKeyboard.addEventListener('geometrychange',e=>{vkH=Math.round(e.target.boundingRect.height);kbMetrics()});
let kbRaf=0;bindInput(el);
resize();kbMetrics();
document.fonts&&document.fonts.addEventListener('loadingdone',()=>layout());


})();
